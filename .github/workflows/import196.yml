name: Publish verified VidDock196
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import196.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-verified-196
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import exact verified distribution bytes
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-268c-8206-b4ae-836996e61095/raw?se=2026-10-20T12%3A45%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=19d07d48-0acc-526f-b0b7-25f28dec0d15&skoid=9063adf3-a524-4acf-b70a-8731b33f2f50&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-19T23%3A02%3A52Z&ske=2026-10-20T23%3A02%3A52Z&sks=b&skv=2026-02-06&sig=Iy7UBaTHb1It78Axt7z8wCSKdPQNXamaDCTd1Y4bkNM%3D'
        run: |
          python - <<'PY'
          import hashlib,io,json,os,pathlib,urllib.request,zipfile
          root=pathlib.Path('.')
          expected='39f0e0ccca422c6b6b1a8cff10ba389f9ac54ec47364cf37f79b8d4f5ceed1f4'
          target=root/'releases/VidDock196.zip'
          prior=json.loads((root/'update.json').read_text())
          if tuple(map(int,prior['version'].split('.')))>(1,9,6):
              raise SystemExit('A newer release is already active; refusing to downgrade')
          if target.exists():
              payload=target.read_bytes()
          else:
              # One-time, read-only transfer of the release-only artifact.
              # It contains only the ZIP and update metadata intended for publication.
              url=os.environ['ARTIFACT_URL']
              print('::add-mask::'+url)
              with urllib.request.urlopen(url,timeout=30) as response:
                  artifact=response.read(2*1024*1024+1)
              if len(artifact)>2*1024*1024:raise SystemExit('Artifact exceeds size limit')
              if hashlib.sha256(artifact).hexdigest()!='5feb394fca88b8bada90afdc553eb956c54f17faf65e6ee535a737471700ca3f':
                  raise SystemExit('Artifact differs from successful private workflow output')
              with zipfile.ZipFile(io.BytesIO(artifact)) as archive:
                  if set(archive.namelist())!={'releases/VidDock196.zip','update.json'}:
                      raise SystemExit('Unexpected artifact contents')
                  metadata=json.loads(archive.read('update.json'))
                  if metadata.get('version')!='1.9.6' or metadata.get('repo')!='watari-naru/viddock' or metadata.get('sha256')!=expected:
                      raise SystemExit('Wrong release metadata')
                  payload=archive.read('releases/VidDock196.zip')
          if hashlib.sha256(payload).hexdigest()!=expected:
              raise SystemExit('Release ZIP checksum mismatch')
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              manifest=json.loads(archive.read('watari_video_helper/manifest.json'))
              if manifest.get('version')!='1.9.6':raise SystemExit('Wrong extension version')
          target.parent.mkdir(exist_ok=True)
          target.write_bytes(payload)
          (root/'update.json').write_text(json.dumps({'repo':'watari-naru/viddock','version':'1.9.6','asset':'releases/VidDock196.zip','sha256':expected,'notes':'Persistent speed settings; batched progress and bounded rendering for large waiting queues'},indent=2)+'\n')
          print('Verified VidDock196 exact release SHA256:',expected)
          PY
      - name: Commit verified package and update pointer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/VidDock196.zip update.json
          if ! git diff --cached --quiet; then
            git commit -m 'release: VidDock196 persistent settings and large-queue UI performance'
            git push
          fi
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v196 >/dev/null 2>&1; then
            gh release create v196 releases/VidDock196.zip VidDockSetup.cmd --target "$(git rev-parse HEAD)" --title VidDock196 --notes 'Fixes fragment count reverting from 8 to 4: changes auto-save, stale settings responses cannot overwrite edits, and folder-only saves preserve the speed setting. Replaces per-job polling with a shared batch request and changed-only history writes. Active saves remain visible; waiting jobs are collapsible and paginated 10 per page. Hidden recent results are not rendered and waiting bars no longer animate. The three-active-save FIFO, HLS transport and downloader are unchanged. Tested with 100 simulated jobs in Chromium, a 203-job authenticated API snapshot, stale-response races, multi-window coalescing, Windows Python 3.12/3.14 installed runtimes and Linux. Actual user-PC CPU reduction has not been measured. Apply the update only after running and waiting downloads finish.'
          fi
