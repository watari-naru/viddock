name: Publish verified VidDock194
on:
  push:
    branches: [main]
    paths: ['distribution/VidDock194.delta', '.github/workflows/import194.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-verified-194
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct checksum-identical tested release
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,pathlib,zipfile,zlib
          root=pathlib.Path('.')
          source=root/'distribution/VidDock194.delta'
          encoded=source.read_text().strip()
          # Normalize two transfer transcription errors; exact digest is mandatory.
          encoded=encoded.replace('ICZ77TjuBs1CtXZu','ICZ77TjuBs1zCtXZu').replace('PHPRVV/G','PHPRV/G')
          assert hashlib.sha256(encoded.encode()).hexdigest()=='f3e395d02f0af8f6364e775e4f7b7904adbf88166562d9996d34928b26735903','Distribution delta checksum mismatch'
          source.write_text(encoded+'\n')
          patch=json.loads(zlib.decompress(base64.b64decode(encoded,validate=True)))
          oldbytes=(root/'releases/VidDock193.zip').read_bytes()
          assert hashlib.sha256(oldbytes).hexdigest()=='acb6b906b3a5424c1c53ca75c1945ee95579ba9994a99fdf70f78b146e0fb451'
          output=root/'releases/VidDock194.zip'
          with zipfile.ZipFile(io.BytesIO(oldbytes)) as old,zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as new:
            assert set(patch).issubset(old.namelist())
            for name in old.namelist():
              data=old.read(name)
              if name in patch:
                lines=data.decode('utf-8').splitlines(keepends=True)
                for start,end,text in reversed(patch[name]):
                  assert 0<=start<=end<=len(lines)
                  lines[start:end]=[text]
                data=''.join(lines).encode('utf-8')
              info=zipfile.ZipInfo(name,(2026,10,19,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
              new.writestr(info,data)
          sha=hashlib.sha256(output.read_bytes()).hexdigest()
          assert sha=='509d9aad69b96f916d92c3c241fd77c0fa379b60aa8034a0af341272dbb38b80','Release bytes differ from the tested private artifact'
          (root/'update.json').write_text(json.dumps({'repo':'watari-naru/viddock','version':'1.9.4','asset':'releases/VidDock194.zip','sha256':sha,'notes':'Multi-download progress, conversion states and per-video history; HLS transport unchanged'},indent=2)+'\n')
          print('Verified exact VidDock194 ZIP',sha)
          PY
      - name: Commit release and update pointer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/VidDock194.zip update.json distribution/VidDock194.delta
          if ! git diff --cached --quiet; then
            git commit -m 'release: verified VidDock194 multiple-download display'
            git push
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v194 >/dev/null 2>&1; then
            gh release create v194 releases/VidDock194.zip VidDockSetup.cmd --target "$(git rev-parse HEAD)" --title VidDock194 --notes 'Independent cards and progress for simultaneous downloads. Separate conversion, completion and failure states. Active tasks stay on top; recent results are collapsible. Tab switching and reopening preserve tracking, and multi-panel storage writes cannot overwrite other jobs. HLS transport unchanged from VidDock193. Windows 3.12/3.14, Linux and Chromium UI tests passed.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VidDock194DistributionCheck
          path: |
            distribution/VidDock194.delta
            releases/VidDock194.zip
          retention-days: 2
