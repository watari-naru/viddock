name: Publish VidDock release
on:
  push:
    branches: [main]
    paths: [update.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: viddock-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public update package and setup
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          meta=json.loads(pathlib.Path('update.json').read_text(encoding='utf-8-sig'))
          version=meta.get('version','')
          if not re.fullmatch(r'\d+\.\d+\.\d+',version): raise SystemExit('Invalid version')
          if meta.get('repo')!='watari-naru/viddock': raise SystemExit('Wrong repository')
          name='VidDock'+version.replace('.','')+'.zip'
          if meta.get('asset')!='releases/'+name: raise SystemExit('Wrong release asset')
          package=pathlib.Path('releases')/name
          if not package.is_file(): raise SystemExit('Release package missing')
          if hashlib.sha256(package.read_bytes()).hexdigest()!=meta.get('sha256'): raise SystemExit('Release hash mismatch')
          setup=pathlib.Path('VidDockSetup.exe').read_bytes()
          checksum=pathlib.Path('VidDockSetup.exe.sha256').read_text(encoding='utf-8-sig').split()
          if len(checksum)!=2 or checksum[1]!='VidDockSetup.exe' or not setup.startswith(b'MZ'): raise SystemExit('Invalid setup')
          if hashlib.sha256(setup).hexdigest()!=checksum[0]: raise SystemExit('Setup hash mismatch')
          print('Verified',name,'and VidDockSetup.exe')
          PY
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("update.json"))["version"])')
          TAG="v$(echo "$VERSION" | tr -d .)"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" VidDockSetup.exe VidDockSetup.exe.sha256 "releases/VidDock$(echo "$VERSION" | tr -d .).zip" VidDockSetup.cmd --target "$(git rev-parse HEAD)" --title "VidDock $VERSION" --notes '初回は VidDockSetup.exe を開いてインストールしてください。以後はアプリ内から更新できます。'
          fi
